<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arus — Dashboard Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --paper: #F0F2ED;
    --paper-alt: #E7EBE1;
    --ink: #14231C;
    --ink-soft: #52604F;
    --ink-faint: #8B9686;
    --accent-green: #2F6F4E;
    --accent-amber: #B8922F;
    --accent-clay: #B8622F;
    --line: #C9D1C4;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 28px 80px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 40px;
  }

  .wordmark { font-family: 'Newsreader', serif; font-size: 26px; font-style: italic; font-weight: 500; letter-spacing: 0.01em; }
  .header-right { display: flex; align-items: center; gap: 22px; }

  .month-select { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--ink-soft); }
  .month-select button {
    background: none; border: 1px solid var(--line); border-radius: 4px;
    width: 26px; height: 26px; color: var(--ink-soft); cursor: pointer;
    font-size: 14px; line-height: 1; transition: border-color 0.15s ease, color 0.15s ease;
  }
  .month-select button:hover { border-color: var(--ink-soft); color: var(--ink); }
  .month-select button:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }
  .month-label { min-width: 92px; text-align: center; font-weight: 500; color: var(--ink); }

  .btn-outline {
    display: inline-flex; align-items: center; gap: 8px;
    background: none; border: 1px solid var(--ink);
    border-radius: 4px; padding: 7px 13px;
    font-family: 'Work Sans', sans-serif; font-size: 13px; font-weight: 500;
    color: var(--ink); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-outline:hover { background: var(--ink); color: var(--paper); }
  .btn-outline:focus-visible { outline: 2px solid var(--accent-green); outline-offset: 2px; }
  .btn-outline svg { width: 13px; height: 13px; flex-shrink: 0; }

  .export-toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
    background: var(--ink); color: var(--paper); font-size: 13px;
    padding: 10px 18px; border-radius: 5px; opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
  }
  .export-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .hero { margin-bottom: 40px; }
  .hero-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .hero-amount {
    font-family: 'Newsreader', serif; font-size: 64px; font-weight: 500;
    line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .hero-sub { margin-top: 10px; font-size: 15px; color: var(--ink-soft); display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .hero-sub strong { color: var(--ink); font-weight: 500; }

  .limit-input {
    font-family: 'Work Sans', sans-serif; font-size: 13px; color: var(--ink-soft);
    background: none; border: none; border-bottom: 1px dashed var(--line);
    text-align: right; width: 82px; padding: 0 0 1px 0; font-variant-numeric: tabular-nums;
  }
  .limit-input:hover { border-bottom-color: var(--ink-faint); }
  .limit-input:focus { outline: none; border-bottom: 1px solid var(--accent-green); }
  .limit-input.lg { font-size: 15px; width: 118px; color: var(--ink); font-weight: 500; }

  .track { margin-top: 20px; height: 6px; background: var(--paper-alt); border-radius: 3px; overflow: hidden; }
  .track-fill { height: 100%; background: var(--accent-green); border-radius: 3px; width: 0%; transition: width 1.1s cubic-bezier(0.16, 1, 0.3, 1); }
  .track-fill.warn { background: var(--accent-clay); }

  .section-title { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .section-sub { font-size: 13px; color: var(--ink-faint); margin-bottom: 20px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .section-flag { font-size: 12.5px; color: var(--accent-clay); }

  .cashflow-card {
    border: 1px solid var(--line); border-radius: 6px;
    padding: 26px 24px; margin-bottom: 40px;
    display: flex; align-items: center; gap: 36px;
  }
  .donut-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
  .donut-wrap svg circle { transition: stroke-dasharray 0.9s cubic-bezier(0.16, 1, 0.3, 1), stroke-dashoffset 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .donut-center .d-label { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; }
  .donut-center .d-value { font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .donut-center .d-value.positive { color: var(--accent-green); }
  .donut-center .d-value.negative { color: var(--accent-clay); }

  .cashflow-legend { display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; font-size: 13px; color: var(--ink-soft); }
  .legend-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .legend-amount { font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .legend-divider { border-top: 1px solid var(--line); margin: 2px 0 4px; }
  .legend-income .legend-amount { color: var(--accent-green); }

  @media (max-width: 620px) { .cashflow-card { flex-direction: column; align-items: flex-start; gap: 22px; } }

  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; gap: 40px; } .hero-amount { font-size: 46px; } }

  .mode-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .mode-row-label { font-size: 12.5px; color: var(--ink-faint); }
  .mode-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .mode-btn {
    background: none; border: none; padding: 5px 13px; font-size: 12.5px;
    color: var(--ink-soft); cursor: pointer; font-family: 'Work Sans', sans-serif;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-btn + .mode-btn { border-left: 1px solid var(--line); }
  .mode-btn.active { background: var(--ink); color: var(--paper); }
  .mode-btn:hover:not(.active) { background: var(--paper-alt); }

  .budget-row { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .budget-row:last-child { border-bottom: none; }
  .budget-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 12px; }
  .budget-name { font-size: 14.5px; color: var(--ink); }
  .budget-keywords { font-size: 11px; color: var(--ink-faint); margin-top: 2px; }
  .budget-limit-wrap { display: flex; align-items: baseline; gap: 5px; font-size: 13px; color: var(--ink-faint); white-space: nowrap; flex-shrink: 0; padding-top: 1px; }

  .cat-bar-track { height: 8px; background: var(--paper-alt); border-radius: 2px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 2px; width: 0%; transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease; }

  .budget-status { margin-top: 7px; font-size: 12.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .budget-status.ok strong { color: var(--accent-green); }
  .budget-status.warn strong { color: var(--accent-amber); }
  .budget-status.over strong { color: var(--accent-clay); }

  .text-link {
    background: none; border: none; padding: 0; font-family: inherit;
    font-size: 12.5px; color: var(--ink-faint); cursor: pointer; text-decoration: underline;
    text-underline-offset: 2px; transition: color 0.15s ease;
  }
  .text-link:hover { color: var(--ink); }

  .txn-list { display: flex; flex-direction: column; }
  .txn-row { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .txn-row:last-child { border-bottom: none; }
  .txn-date { font-size: 12px; color: var(--ink-faint); padding-top: 2px; }
  .txn-merchant { font-size: 14.5px; color: var(--ink); margin-bottom: 4px; }
  .txn-tag { display: inline-block; font-size: 11.5px; color: var(--ink-soft); background: var(--paper-alt); padding: 2px 8px; border-radius: 3px; }
  .txn-manual { font-size: 11px; color: var(--ink-faint); font-style: italic; margin-left: 6px; }
  .txn-amount { font-size: 14.5px; font-variant-numeric: tabular-nums; color: var(--accent-clay); white-space: nowrap; padding-top: 2px; }
  .txn-amount.credit { color: var(--accent-green); }

  .sync-banner { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--ink-faint); flex-wrap: wrap; }
  .sync-left { display: flex; align-items: center; gap: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-green); flex-shrink: 0; }
  .connecting-text { font-size: 12.5px; color: var(--ink-soft); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  .connect-btn-sm {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: none; padding: 0;
    font-family: 'Work Sans', sans-serif; font-size: 12.5px; font-weight: 500;
    color: var(--accent-green); cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .connect-btn-sm:hover { color: var(--ink); }

  .manual-form {
    border: 1px solid var(--line); border-radius: 6px;
    padding: 18px 18px 20px; margin-bottom: 18px;
    flex-direction: column; gap: 14px;
  }
  .form-row { display: flex; flex-direction: column; gap: 5px; }
  .form-row label { font-size: 11.5px; color: var(--ink-faint); }
  .form-input {
    font-family: 'Work Sans', sans-serif; font-size: 13.5px; color: var(--ink);
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 6px 2px; width: 100%;
  }
  .form-input:focus { outline: none; border-bottom-color: var(--accent-green); }
  .form-actions { display: flex; align-items: center; gap: 16px; margin-top: 2px; }
  .form-error { font-size: 12px; color: var(--accent-clay); }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="wordmark">Arus</div>
    <div class="header-right">
      <div class="month-select">
        <button id="prevMonth" aria-label="Bulan sebelumnya">‹</button>
        <span class="month-label" id="monthLabel">September 2026</span>
        <button id="nextMonth" aria-label="Bulan berikutnya">›</button>
      </div>
      <button class="btn-outline" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></svg>
        Export .xlsx
      </button>
    </div>
  </header>

  <div class="hero">
    <div class="hero-label">Total pengeluaran bulan ini</div>
    <div class="hero-amount" id="heroAmount">Rp0</div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="track"><div class="track-fill" id="trackFill"></div></div>
  </div>

  <div class="section-title">Arus Kas Bulan Ini</div>
  <div class="section-sub">Pemasukan vs pengeluaran per kategori</div>
  <div class="cashflow-card" id="cashflowCard">
    <div class="donut-wrap" id="donutWrap"></div>
    <div class="cashflow-legend" id="cashflowLegend"></div>
  </div>

  <div class="grid">
    <div>
      <div class="section-head">
        <div class="section-title">Budget per Kategori</div>
        <div class="section-flag" id="flagText"></div>
      </div>
      <div class="section-sub">Klik angka untuk mengubah batas atau target</div>
      <div class="mode-row">
        <span class="mode-row-label">Atur pakai</span>
        <div class="mode-toggle">
          <button class="mode-btn active" data-mode="rp">Rp</button>
          <button class="mode-btn" data-mode="pct">%</button>
        </div>
      </div>
      <div id="categoryList"></div>
    </div>

    <div>
      <div class="section-head">
        <div class="section-title" style="margin-bottom:0;">Transaksi Terbaru</div>
        <button class="text-link" id="addTxnToggle">+ Tambah manual</button>
      </div>
      <div class="section-sub">Otomatis dari email bank, atau ditambah manual (mis. tunai)</div>
      <div class="manual-form" id="manualForm" style="display:none;"></div>
      <div id="txnPanelBody"></div>
    </div>
  </div>

</div>

<div class="export-toast" id="exportToast">File .xlsx berhasil dibuat</div>

<script>
  const categoryDefs = {
    "Food":                { keywords: "makanan · gofood · jajan · kopi", type: "expense" },
    "Transport":           { keywords: "bensin · parkir · QRIS KAI · service bengkel", type: "expense" },
    "Social":              { keywords: "cafe · nongkrong · meeting fee · hadiah · kondangan", type: "expense" },
    "Utilities":           { keywords: "rumah · listrik · internet · wifi · housekeeping", type: "expense" },
    "Medicine":            { keywords: "vitamin · feminine hygiene · dokter · obat", type: "expense" },
    "Saving & Investment": { keywords: "tabungan · reksadana · saham · deposito · emas", type: "saving" },
    "Others":              { keywords: "belanja online · top up e-wallet · lainnya", type: "expense" }
  };

  const CATEGORY_COLORS = {
    "Food": "#2F6F4E", "Transport": "#4C8768", "Social": "#7BA88C",
    "Utilities": "#A8C1AE", "Medicine": "#C7D7C9", "Saving & Investment": "#3D6B7D",
    "Others": "#B9B29C"
  };

  const MONTH_ABBR = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];

  const data = {
    "September 2026": {
      budget: 6800000,
      categories: [
        { name: "Food",      amount: 103000,  limit: 1000000 },
        { name: "Transport", amount: 180400,  limit: 700000 },
        { name: "Social",    amount: 90800,   limit: 800000 },
        { name: "Utilities", amount: 93000,   limit: 900000 },
        { name: "Medicine",  amount: 0,       limit: 400000 },
        { name: "Saving & Investment", amount: 0, limit: 1500000 },
        { name: "Others",   amount: 209225,  limit: 300000 }
      ],
      transactions: [
        { date: "16 Sep", merchant: "Shopee Indonesia — QRIS", tag: "Others", amount: -27334 },
        { date: "16 Sep", merchant: "Top Up DANA", tag: "Others", amount: -20000 },
        { date: "16 Sep", merchant: "Token Listrik — BRImo", tag: "Utilities", amount: -53000 },
        { date: "13 Sep", merchant: "Indomaret — QRIS", tag: "Food", amount: -69100 },
        { date: "10 Sep", merchant: "Looks Laundry — QRIS", tag: "Utilities", amount: -40000 },
        { date: "09 Sep", merchant: "ALGO B581 AFM Dago296", tag: "Social", amount: -90800 },
        { date: "08 Sep", merchant: "Shopee Indonesia — QRIS", tag: "Others", amount: -161891 },
        { date: "04 Sep", merchant: "Indomaret — QRIS", tag: "Food", amount: -15900 },
        { date: "04 Sep", merchant: "Access By KAI — QRIS", tag: "Transport", amount: -5000 },
        { date: "03 Sep", merchant: "Access By KAI — QRIS", tag: "Transport", amount: -87700 },
        { date: "03 Sep", merchant: "Access By KAI — QRIS", tag: "Transport", amount: -87700 },
        { date: "02 Sep", merchant: "Warung Nasi Bu Sri — QRIS", tag: "Food", amount: -18000 }
      ]
    },
    "Agustus 2026": {
      budget: 6800000,
      categories: [
        { name: "Food",      amount: 1975400, limit: 1000000 },
        { name: "Transport", amount: 540000,  limit: 700000 },
        { name: "Social",    amount: 1220100, limit: 800000 },
        { name: "Utilities", amount: 872000,  limit: 900000 },
        { name: "Medicine",  amount: 160000,  limit: 400000 },
        { name: "Saving & Investment", amount: 1600000, limit: 1500000 }
      ],
      transactions: [
        { date: "31 Agu", merchant: "Housekeeping — Sabun & Detergen", tag: "Utilities", amount: -180000 },
        { date: "29 Agu", merchant: "PLN — Token Listrik", tag: "Utilities", amount: -420000 },
        { date: "27 Agu", merchant: "Service Bengkel Motor", tag: "Transport", amount: -350000 },
        { date: "25 Agu", merchant: "Transfer masuk — Gaji", tag: "Income", amount: 8500000, credit: true },
        { date: "22 Agu", merchant: "Dokter — Klinik Umum", tag: "Medicine", amount: -160000 },
        { date: "20 Agu", merchant: "Emas Digital — Pegadaian", tag: "Saving & Investment", amount: -300000 }
      ]
    }
  };

  const months = Object.keys(data);
  let idx = 0;
  let gmailConnected = false;
  let connecting = false;
  let categoryMode = "rp";
  let manualFormOpen = false;

  const fmt = (n) => "Rp" + Math.abs(Math.round(n)).toLocaleString("id-ID");
  const parseNum = (s) => Number(String(s).replace(/[^\d]/g, "")) || 0;
  const todayISO = () => new Date().toISOString().slice(0, 10);
  const formatDateLabel = (isoStr) => {
    const dt = new Date(isoStr + "T00:00:00");
    return `${dt.getDate()} ${MONTH_ABBR[dt.getMonth()]}`;
  };

  const MAIL_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>`;

  function spentTotal(month) { return data[month].categories.reduce((s, c) => s + c.amount, 0); }
  function monthIncome(month) { return data[month].transactions.filter(t => t.credit).reduce((s, t) => s + t.amount, 0); }

  function renderCashflow() {
    const month = months[idx];
    const d = data[month];
    const expense = spentTotal(month);
    const income = monthIncome(month);
    const net = income - expense;

    const r = 60, cx = 75, cy = 75, sw = 20;
    const circumference = 2 * Math.PI * r;
    let cumulative = 0;

    const circles = d.categories.map(c => {
      const pct = expense > 0 ? c.amount / expense : 0;
      const dash = pct * circumference;
      const gap = circumference - dash;
      const offset = -cumulative * circumference;
      cumulative += pct;
      return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${CATEGORY_COLORS[c.name]}" stroke-width="${sw}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${offset}" />`;
    }).join("");

    document.getElementById("donutWrap").innerHTML = `
      <svg viewBox="0 0 150 150" style="transform:rotate(-90deg)">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--paper-alt)" stroke-width="${sw}" />
        ${circles}
      </svg>
      <div class="donut-center">
        <div class="d-label">Arus kas bersih</div>
        <div class="d-value ${net >= 0 ? "positive" : "negative"}">${net >= 0 ? "+" : "−"}${fmt(net)}</div>
      </div>
    `;

    const legendRows = [
      `<div class="legend-row legend-income">
        <div class="legend-left"><span class="legend-dot" style="background:var(--accent-green)"></span>Pemasukan</div>
        <div class="legend-amount">+${fmt(income)}</div>
      </div>`,
      `<div class="legend-divider"></div>`,
      ...d.categories.map(c => `
        <div class="legend-row">
          <div class="legend-left"><span class="legend-dot" style="background:${CATEGORY_COLORS[c.name]}"></span>${c.name}</div>
          <div class="legend-amount">−${fmt(c.amount)}</div>
        </div>
      `)
    ].join("");

    document.getElementById("cashflowLegend").innerHTML = legendRows;
  }

  function renderManualForm() {
    const el = document.getElementById("manualForm");
    if (!manualFormOpen) { el.style.display = "none"; el.innerHTML = ""; return; }

    el.style.display = "flex";
    const categoryOptions = Object.keys(categoryDefs).map(name => `<option value="${name}">${name}</option>`).join("");

    el.innerHTML = `
      <div class="mode-toggle" id="txnTypeToggle">
        <button type="button" class="mode-btn active" data-type="expense">Pengeluaran</button>
        <button type="button" class="mode-btn" data-type="income">Pemasukan</button>
      </div>
      <div class="form-row">
        <label>Tanggal</label>
        <input type="date" class="form-input" id="txnDate" value="${todayISO()}">
      </div>
      <div class="form-row" id="txnCategoryRow">
        <label>Kategori</label>
        <select class="form-input" id="txnCategory">${categoryOptions}</select>
      </div>
      <div class="form-row">
        <label>Keterangan</label>
        <input type="text" class="form-input" id="txnMerchant" placeholder="Contoh: Parkir tunai, bayar tukang">
      </div>
      <div class="form-row">
        <label>Jumlah (Rp)</label>
        <input type="text" inputmode="numeric" class="form-input" id="txnAmount" placeholder="Contoh: 20000">
      </div>
      <div id="txnFormError" class="form-error"></div>
      <div class="form-actions">
        <button class="btn-outline" id="submitTxnBtn" type="button">Tambah transaksi</button>
        <button class="text-link" id="cancelTxnBtn" type="button">Batal</button>
      </div>
    `;

    let txnType = "expense";
    el.querySelectorAll("#txnTypeToggle .mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        txnType = btn.dataset.type;
        el.querySelectorAll("#txnTypeToggle .mode-btn").forEach(b => b.classList.toggle("active", b === btn));
        document.getElementById("txnCategoryRow").style.display = txnType === "income" ? "none" : "flex";
      });
    });

    document.getElementById("cancelTxnBtn").addEventListener("click", () => { manualFormOpen = false; renderManualForm(); });

    document.getElementById("submitTxnBtn").addEventListener("click", () => {
      const month = months[idx];
      const dateVal = document.getElementById("txnDate").value;
      const amountVal = parseNum(document.getElementById("txnAmount").value);
      const errorEl = document.getElementById("txnFormError");

      if (!dateVal || amountVal <= 0) {
        errorEl.textContent = "Isi tanggal dan jumlah yang valid dulu ya.";
        return;
      }

      const dateLabel = formatDateLabel(dateVal);
      const merchant = document.getElementById("txnMerchant").value.trim() ||
        (txnType === "income" ? "Pemasukan tunai" : "Pengeluaran tunai");

      if (txnType === "income") {
        data[month].transactions.unshift({ date: dateLabel, merchant, tag: "Income", amount: amountVal, credit: true, manual: true });
      } else {
        const category = document.getElementById("txnCategory").value;
        data[month].transactions.unshift({ date: dateLabel, merchant, tag: category, amount: -Math.abs(amountVal), manual: true });
        const catObj = data[month].categories.find(c => c.name === category);
        if (catObj) catObj.amount += Math.abs(amountVal);
      }

      manualFormOpen = false;
      renderManualForm();
      render();
    });
  }

  function renderTxnPanel() {
    const body = document.getElementById("txnPanelBody");
    const month = months[idx];
    const d = data[month];

    const txnRows = d.transactions.map(t => `
      <div class="txn-row">
        <div class="txn-date">${t.date}</div>
        <div>
          <div class="txn-merchant">${t.merchant}</div>
          <span class="txn-tag">${t.tag}</span>${t.manual ? '<span class="txn-manual">manual</span>' : ""}
        </div>
        <div class="txn-amount ${t.credit ? "credit" : ""}">${t.credit ? "+" : "−"}${fmt(t.amount)}</div>
      </div>
    `).join("");

    let banner;
    if (connecting) {
      banner = `<div class="sync-banner"><span class="connecting-text">Menghubungkan ke Google...</span></div>`;
    } else if (!gmailConnected) {
      banner = `
        <div class="sync-banner">
          <span>Gmail belum terhubung — transaksi bank otomatis belum masuk.</span>
          <button class="connect-btn-sm" id="connectGmailBtn">${MAIL_ICON} Hubungkan Gmail</button>
        </div>`;
    } else {
      banner = `
        <div class="sync-banner">
          <div class="sync-left"><span class="dot"></span> Gmail terhubung · sinkron terakhir 12 menit lalu</div>
          <button class="text-link" id="disconnectGmailBtn">Putuskan</button>
        </div>`;
    }

    body.innerHTML = `<div class="txn-list">${txnRows}</div>${banner}`;

    if (!gmailConnected && !connecting) {
      document.getElementById("connectGmailBtn").addEventListener("click", () => {
        connecting = true;
        renderTxnPanel();
        setTimeout(() => { connecting = false; gmailConnected = true; renderTxnPanel(); }, 900);
      });
    }
    if (gmailConnected) {
      document.getElementById("disconnectGmailBtn").addEventListener("click", () => { gmailConnected = false; renderTxnPanel(); });
    }
  }

  function render() {
    const month = months[idx];
    const d = data[month];
    document.getElementById("monthLabel").textContent = month;

    const spent = spentTotal(month);
    const remaining = d.budget - spent;
    const pct = Math.min(100, Math.round((spent / d.budget) * 100));
    const over = spent > d.budget;

    document.getElementById("heroAmount").textContent = fmt(spent);
    document.getElementById("heroSub").innerHTML =
      `<span>dari budget Rp</span>
       <input class="limit-input lg" id="totalBudgetInput" value="${d.budget.toLocaleString("id-ID")}" inputmode="numeric" />
       <span>· ${over ? "melebihi" : "tersisa"} <strong>${fmt(remaining)}</strong></span>`;

    document.getElementById("totalBudgetInput").addEventListener("change", (e) => {
      const val = parseNum(e.target.value);
      d.budget = val > 0 ? val : 1;
      render();
    });
    document.getElementById("totalBudgetInput").addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });

    const fill = document.getElementById("trackFill");
    fill.classList.toggle("warn", pct >= 90);
    requestAnimationFrame(() => { fill.style.width = pct + "%"; });

    const overCount = d.categories.filter(c => {
      const type = categoryDefs[c.name].type;
      return type === "expense" ? c.amount > c.limit : c.amount < c.limit;
    }).length;
    document.getElementById("flagText").textContent = overCount > 0 ? `${overCount} kategori perlu perhatian` : "";

    const catList = document.getElementById("categoryList");
    catList.innerHTML = "";
    d.categories.forEach((c, i) => {
      const type = categoryDefs[c.name].type;
      const ratio = c.amount / c.limit;
      const barPct = Math.min(100, Math.round(ratio * 100));
      let status = "ok", color = "var(--accent-green)";
      if (type === "expense") {
        if (ratio >= 1) { status = "over"; color = "var(--accent-clay)"; }
        else if (ratio >= 0.85) { status = "warn"; color = "var(--accent-amber)"; }
      } else {
        if (ratio >= 1) { status = "ok"; color = "var(--accent-green)"; }
        else if (ratio >= 0.85) { status = "warn"; color = "var(--accent-amber)"; }
        else { status = "over"; color = "var(--accent-clay)"; }
      }

      const prefixWord = type === "saving" ? "target" : "maks";
      const inputValue = categoryMode === "rp" ? c.limit.toLocaleString("id-ID") : Math.round((c.limit / d.budget) * 100);
      const suffix = categoryMode === "pct" ? "%" : "";
      const prefixDisplay = categoryMode === "rp" ? `${prefixWord} Rp` : prefixWord;

      let statusText;
      if (type === "expense") {
        statusText = status === "over"
          ? `<strong>melebihi ${fmt(c.amount - c.limit)}</strong>`
          : `<strong>tersisa ${fmt(c.limit - c.amount)}</strong>`;
      } else {
        statusText = ratio >= 1
          ? `<strong>target tercapai</strong> (+${fmt(c.amount - c.limit)})`
          : `<strong>${fmt(c.limit - c.amount)} lagi</strong> dari target`;
      }
      const verb = type === "saving" ? "terkumpul" : "terpakai";

      const row = document.createElement("div");
      row.className = "budget-row";
      row.innerHTML = `
        <div class="budget-top">
          <div>
            <div class="budget-name">${c.name}</div>
            <div class="budget-keywords">${categoryDefs[c.name].keywords}</div>
          </div>
          <div class="budget-limit-wrap">
            <span>${prefixDisplay}</span>
            <input class="limit-input" data-idx="${i}" value="${inputValue}" inputmode="numeric" />
            <span>${suffix}</span>
          </div>
        </div>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:0%; background:${color}"></div></div>
        <div class="budget-status ${status}">${fmt(c.amount)} ${verb} · ${statusText}</div>
      `;
      catList.appendChild(row);
      requestAnimationFrame(() => { row.querySelector(".cat-bar-fill").style.width = barPct + "%"; });
    });

    catList.querySelectorAll(".limit-input").forEach(inp => {
      inp.addEventListener("change", (e) => {
        const i = Number(e.target.dataset.idx);
        const val = parseNum(e.target.value);
        if (categoryMode === "rp") {
          data[month].categories[i].limit = val > 0 ? val : 1;
        } else {
          const pctVal = val > 0 ? val : 1;
          data[month].categories[i].limit = Math.round((pctVal / 100) * d.budget);
        }
        render();
      });
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") e.target.blur(); });
    });

    renderTxnPanel();
    renderCashflow();
  }

  document.querySelectorAll(".mode-btn").forEach(btn => {
    if (btn.closest("#txnTypeToggle")) return;
    btn.addEventListener("click", () => {
      categoryMode = btn.dataset.mode;
      document.querySelectorAll(".mode-row .mode-btn").forEach(b => b.classList.toggle("active", b === btn));
      render();
    });
  });

  document.getElementById("addTxnToggle").addEventListener("click", () => {
    manualFormOpen = !manualFormOpen;
    renderManualForm();
  });

  document.getElementById("prevMonth").addEventListener("click", () => { idx = (idx + 1) % months.length; render(); });
  document.getElementById("nextMonth").addEventListener("click", () => { idx = (idx - 1 + months.length) % months.length; render(); });

  function exportToExcel() {
    const month = months[idx];
    const d = data[month];

    const summaryRows = [
      ["Ringkasan Budget", month],
      [],
      ["Kategori", "Terpakai/Terkumpul (Rp)", "Batas/Target (Rp)", "Selisih (Rp)", "Status"],
      ...d.categories.map(c => {
        const type = categoryDefs[c.name].type;
        const isGood = type === "expense" ? c.amount <= c.limit : c.amount >= c.limit;
        const status = isGood ? (type === "expense" ? "Aman" : "Target tercapai") : (type === "expense" ? "Melebihi" : "Kurang dari target");
        return [c.name, c.amount, c.limit, c.limit - c.amount, status];
      })
    ];

    const txnRows = [
      ["Tanggal", "Merchant", "Kategori", "Jumlah (Rp)", "Sumber"],
      ...d.transactions.map(t => [t.date, t.merchant, t.tag, t.credit ? t.amount : -Math.abs(t.amount), t.manual ? "Manual" : "Email"])
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), "Ringkasan Budget");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txnRows), "Transaksi");

    const filename = `Arus - ${month}.xlsx`;
    XLSX.writeFile(wb, filename);

    const toast = document.getElementById("exportToast");
    toast.textContent = `${filename} berhasil dibuat`;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2600);
  }

  document.getElementById("exportBtn").addEventListener("click", exportToExcel);

  render();
</script>

</body>
</html>
